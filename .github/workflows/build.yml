name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pio_env: [esp32-s3-touch-lcd-7b, esp32-s3-touch-lcd-7b-brightness-test]
    env:
      PIO_ENV: ${{ matrix.pio_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e "$PIO_ENV"

      - name: Check network memory configuration
        run: |
          python tools/check_network_stack.py --build ".pio/build/$PIO_ENV"
          python tools/check_tls_memory.py --config ".pio/build/$PIO_ENV/config/sdkconfig.h"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.pio_env }}
          path: .pio/build/${{ env.PIO_ENV }}/firmware.bin
