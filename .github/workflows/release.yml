name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Only the explicitly reviewed reference-test releases enable these controls.
      PIO_ENV: ${{ (github.ref_name == 'v1.0.33' || github.ref_name == 'v1.0.34' || github.ref_name == 'v1.0.35') && 'esp32-s3-touch-lcd-7b-brightness-test' || 'esp32-s3-touch-lcd-7b' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e "$PIO_ENV"

      - name: Check RGB cache guard
        run: |
          python -m unittest discover -s tools -p "test_check_rgb_cache.py"
          python tools/check_rgb_cache.py --config ".pio/build/$PIO_ENV/config/sdkconfig.h"

      - name: Check network memory configuration
        run: |
          python tools/check_network_stack.py --build ".pio/build/$PIO_ENV"
          python tools/check_tls_memory.py --config ".pio/build/$PIO_ENV/config/sdkconfig.h"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/${{ env.PIO_ENV }}/firmware.bin
          generate_release_notes: true
